# Use postgres/example user/password credentials
version: '3.1'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example_password
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080